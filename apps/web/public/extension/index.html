<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fenshot extension for Chrome, Firefox and Edge: read any chess board on your screen</title>
<meta name="description" content="See a chess puzzle posted as a picture? One click reads the board and puts the position on a real board you can play on. Works on screenshots, chess sites and book diagrams. Free, open source, no account." />
<link rel="canonical" href="https://fenshot.com/extension/" />
<link rel="icon" href="/favicon.svg" />
<meta property="og:type" content="website" />
<meta property="og:title" content="fenshot extension: chess board to FEN in one click" />
<meta property="og:description" content="Reads any chess board on your screen and opens it on a playable analysis board. Free, open source, runs locally. Chrome, Firefox, Edge." />
<meta property="og:url" content="https://fenshot.com/extension/" />
<meta property="og:image" content="https://fenshot.com/og.png" />
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "fenshot extension",
  "url": "https://fenshot.com/extension/",
  "description": "Browser extension that reads the chess position on any page or screenshot and opens it on a playable analysis board. Chess board image to FEN in one click.",
  "applicationCategory": "BrowserApplication",
  "operatingSystem": "Chrome, Firefox, Edge",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
}

<style>
  :root {
    --bg: #0c1117;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --border: #263243;
    --accent: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card { max-width: 460px; text-align: center; }
  .brand { font-size: 30px; font-weight: 700; color: #f1f5f9; letter-spacing: -0.02em; }
  .brand span { color: var(--accent); }
  .tag { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .status { margin-top: 26px; font-size: 15px; color: var(--muted); }
  .buttons { margin-top: 18px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  a.store {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 168px;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
  }
  a.store svg { width: 16px; height: 16px; flex: none; }
  a.store:hover { color: var(--text); border-color: var(--muted); }
  a.store.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #0c1117;
    font-weight: 600;
  }
  .foot { margin-top: 26px; font-size: 13px; color: var(--muted); }
  .foot a { color: var(--muted); }
</style>

<body>
<div class="card">
  <div class="brand"><span>fen</span>shot</div>
  <div class="tag">screenshot in, FEN out. free, open source, runs entirely in your browser.</div>
  <div class="status" id="status"></div>
  <div class="buttons" id="buttons"></div>
  <div class="foot">
    prefer no install? <a href="/">use the web version</a> ·
    <a href="https://github.com/scoriiu/fenshot" target="_blank" rel="noreferrer">source on github</a>
  </div>
</div>
<script>
  var STORES = {
    Chrome: "https://chromewebstore.google.com/detail/fenshot-chess-board-to-fe/fpkdijjlnafehkdkjmkppcekocjdomkc",
    Firefox: "https://addons.mozilla.org/en-US/firefox/addon/fenshot/",
    Edge: "https://microsoftedge.microsoft.com/addons/detail/fenshot-chess-board-to-f/cjcpedpebpfcedbcfejppadobfohbaif"
  };
  var ua = navigator.userAgent;
  var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
  var browser = ua.indexOf("Edg/") >= 0 ? "Edge" : ua.indexOf("Firefox") >= 0 ? "Firefox" : "Chrome";
  var isFirefoxAndroid = isMobile && browser === "Firefox";

  var statusEl = document.getElementById("status");
  var buttonsEl = document.getElementById("buttons");

  var ICONS = {

  };

  var SVG_NS = "http://www.w3.org/2000/svg";
  function icon(name) {
    var svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("fill", "currentColor");
    svg.setAttribute("aria-hidden", "true");
    var path = document.createElementNS(SVG_NS, "path");
    path.setAttribute("d", ICONS[name]);
    svg.appendChild(path);
    return svg;
  }

  Object.keys(STORES).forEach(function (name) {
    var a = document.createElement("a");
    a.className = "store" + (name === browser && (!isMobile || isFirefoxAndroid) ? " primary" : "");
    a.href = STORES[name];
    a.target = "_blank";
    a.rel = "noreferrer";
    a.setAttribute("data-umami-event", "store-click");
    a.setAttribute("data-umami-event-store", name.toLowerCase());
    a.appendChild(icon(name));
    a.appendChild(document.createTextNode(name === browser ? "Add to " + name : name));
    buttonsEl.appendChild(a);
  });

  if (isMobile && !isFirefoxAndroid) {
    statusEl.textContent = "the extension is for desktop browsers. on your phone, the web version below does the same job, no install needed.";
  } else {
    statusEl.textContent = "taking you to the " + browser + " store\u2026 if nothing happens, use the button below.";
    setTimeout(function () {
      // sendBeacon-based, survives the navigation
      if (window.umami && window.umami.track) window.umami.track("store-redirect", { store: browser.toLowerCase() });
      window.location.href = STORES[browser];
    }, 1200);
  }
</script>
